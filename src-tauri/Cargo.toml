[package]
name = "voicecraft"
version = "0.1.0"
description = "Local voice cloning and podcast assembly studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voicecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
